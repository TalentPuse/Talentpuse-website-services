# Dev-only overlay — auto-merged by `docker compose` in this directory.
# Keeps prod-unsafe bits (host source mounts, local DB creds) OUT of the
# committed base docker-compose.yml. Not used by CI/CD deploys.
services:
  backend:
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./alembic:/app/alembic
    environment:
      DATABASE_URL: postgresql://admin:password@talentpulse-postgres:5432/warehouse
