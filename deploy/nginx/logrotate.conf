# Xoay vong log truy cap nginx.
#
# BAT BUOC phai cai dat, khong phai tuy chon: tu khi log duoc ghi ra host
# (docker-compose.yml, mount ./logs/nginx), moi request deu them mot dong JSON
# va khong co gi tu don. Khong xoay vong thi file lon dan cho toi khi day o dia
# cua web box — luc do nginx khong ghi duoc log nua va, tuy dung o dau, ca
# Postgres lan Docker tren cung o dia cung hong theo.
#
# postrotate gui USR1 cho nginx: sau khi doi ten file, tien trinh nginx VAN
# dang giu file descriptor cu. Thieu tin hieu nay thi nginx tiep tuc ghi vao
# file da bi doi ten, file moi mai mai rong con dia thi khong he duoc giai
# phong (dia chi thu hoi khi tien trinh cuoi cung dong file).
#
# delaycompress: nen file o vong sau chu khong nen ngay, vi ngay sau khi doi
# ten nginx co the con dang ghi not vai dong vao file cu.
#
# CAI DAT (chon MOT trong hai, ghi lai lua chon vao runbook deploy):
#   (a) tren host:  sudo cp deploy/nginx/logrotate.conf /etc/logrotate.d/tp-nginx
#       roi sua duong dan thanh duong dan that tren host (./logs/nginx),
#       va bo postrotate — nginx chay trong container nen /var/run/nginx.pid
#       cua host khong phai cua no; thay bang:
#           docker kill --signal=USR1 tp-nginx
#   (b) trong container: copy vao /etc/logrotate.d/ va chay logrotate trong do.
# Cach (a) duoc uu tien: image nginx:alpine khong co san logrotate.
/var/log/nginx/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0640 nginx nginx
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid)
    endscript
}
