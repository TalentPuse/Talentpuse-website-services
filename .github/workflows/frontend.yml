name: CI/CD — Frontend

on:
  push:
    branches: [develop]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [develop]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

concurrency:
  group: talentpulse-frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Build & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Jest KHONG duoc chay o day tu truoc: job nay chi `npm run build`, ma
      # `next build` khong chay test. Ket qua la ca bo test (hien 13 suite /
      # 101 test) chua bao gio gac cho mot lan deploy nao — sua lam do test van
      # di thang len production.
      - name: Run tests
        run: npm test -- --ci

      - name: Build (type check + compile)
        run: npm run build

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          file: apps/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Next INLINE HOA `NEXT_PUBLIC_*` luc BUILD, nen ca 4 bien nay PHAI o
          # day. Dat chung o `environment:` trong compose khong co tac dung —
          # image da nuong xong gia tri roi.
          #
          # AI_HOME la kill-switch cua bo mat AI (lib/flags.ts).
          # Thieu hai dong nay thi MOI image tu CI deu build voi AI TAT CUNG:
          # dock o /applications khong bao gio hien tren prod, du local bat duoc.
          #
          # Dung `vars` chu KHONG phai `secrets`: gia tri bi inline vao bundle
          # cong khai ma trinh duyet tai ve, nen chung khong phai bi mat. De
          # trong ⇒ tat, giong mac dinh cua docker-compose.yml.
          build-args: |
            NEXT_PUBLIC_API_BASE=${{ secrets.NEXT_PUBLIC_API_BASE }}
            NEXT_PUBLIC_DOMAIN=${{ secrets.NEXT_PUBLIC_DOMAIN }}
            NEXT_PUBLIC_AI_HOME=${{ vars.NEXT_PUBLIC_AI_HOME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    # `talentpulse_backend` chu KHONG phai `talentpulse_frontend`: chi co MOT
    # runner tren web box va no mang label nay. Doi label khac thi job treo vo
    # han o "Waiting for a runner to pick up this job" — khong bao gio timeout,
    # khong bao gio bao loi.
    #
    # Frontend cung BUOC phai cung may voi backend: nginx proxy toi
    # `tp-frontend-standalone` bang TEN CONTAINER, chi phan giai duoc khi hai
    # container cung docker network — tuc cung host.
    runs-on: [self-hosted, Linux, X64, talentpulse_backend]
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create runtime .env
        run: |
          echo "Working directory: $(pwd)"
          rm -f .env

          cat > .env <<'EOF'
          PORT=8002
          API_BASE_INTERNAL=${{ secrets.API_BASE_INTERNAL }}
          NEXT_PUBLIC_API_BASE=${{ secrets.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_DOMAIN=${{ secrets.NEXT_PUBLIC_DOMAIN }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          # Ba workflow (backend/frontend/infra) cung GHI DE mot file .env tren
          # runner, va compose noi suy CA FILE luc parse. Nen `.env` cua workflow
          # nay van phai co du cac bien `:?` cua service KHAC, neu khong
          # `docker compose up -d frontend` chet ngay o buoc noi suy — dung kieu
          # loi MCP_DATABASE_URL da lam do deploy backend hom nay.
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          APP_POSTGRES_PASSWORD=${{ secrets.APP_POSTGRES_PASSWORD }}
          EOF
          sed -i 's/^[[:space:]]*//' .env

          if [ ! -f .env ]; then
            echo "Failed to create .env"
            exit 1
          fi
          echo ".env created successfully"

      - name: Deploy with Docker Compose
        run: |
          export REGISTRY=${{ env.REGISTRY }}
          export IMAGE_NAME=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          export IMAGE_TAG=sha-${{ github.sha }}
          export IMAGE_TAG_FALLBACK=${{ github.ref_name }}

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          if ! docker pull ${REGISTRY}/${IMAGE_NAME}-frontend:${IMAGE_TAG}; then
            echo "Fallback to ${IMAGE_TAG_FALLBACK}"
            export IMAGE_TAG=${IMAGE_TAG_FALLBACK}
            docker pull ${REGISTRY}/${IMAGE_NAME}-frontend:${IMAGE_TAG}
          fi

          export FRONTEND_IMAGE=${REGISTRY}/${IMAGE_NAME}-frontend:${IMAGE_TAG}

          # Go container cua compose project cu (xem chu thich trong backend.yml).
          docker rm -f tp-frontend-standalone 2>/dev/null || true

          docker compose up -d --no-build frontend
          docker image prune -f

          echo "Deployment successful!"
          docker compose ps frontend
