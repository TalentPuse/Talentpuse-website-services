# Reverse proxy cho web box: một cửa vào duy nhất (:80), phía sau là
# frontend (Next.js) và backend (FastAPI).
#
# Định tuyến:
#   /api/  -> tp-backend:8001
#   /      -> tp-frontend-standalone:8002
#
# TLS: file này CỐ Ý chỉ nghe :80. Hiện TLS đang kết thúc ở Cloudflare
# (xem docs/DEPLOY.md). Khi nào muốn nginx tự giữ chứng chỉ thì thêm block
# `listen 443 ssl` và mount cert vào — phần proxy bên dưới giữ nguyên.

upstream tp_backend {
    server tp-backend:8001;
    keepalive 32;
}

upstream tp_frontend {
    server tp-frontend-standalone:8002;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # CV upload tối đa 5MB (giao diện đăng ký ghi đúng con số này).
    # Mặc định của nginx là 1m — để nguyên thì nginx trả 413 TRƯỚC khi request
    # tới được backend, người dùng thấy lỗi mà log backend sạch trơn.
    client_max_body_size 10m;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://tp_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── BẮT BUỘC cho SSE ─────────────────────────────────────────────
        # Chat AI và agent stream bằng Server-Sent Events qua /api/agent/.
        # Nginx mặc định BUFFER phản hồi upstream: nó gom cả stream rồi mới
        # trả một cục — ô chat đứng im hàng chục giây rồi mọi thứ hiện cùng
        # lúc, hoặc treo hẳn. Ba dòng dưới tắt buffer và bỏ header Connection
        # mặc định (SSE cần kết nối giữ mở).
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # Agent gọi LLM có thể chạy lâu (client OpenAI đặt timeout 120s cho
        # parse CV). Timeout mặc định 60s của nginx sẽ cắt ngang giữa chừng.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 30s;
    }

    location / {
        proxy_pass http://tp_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout    300s;
        proxy_connect_timeout 30s;
    }

    # Cho ingress/uptime check ping mà không đụng tới app.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
