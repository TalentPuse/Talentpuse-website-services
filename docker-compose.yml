# Monorepo compose — ca 3 app trong 1 file, 1 project.
#
# Deploy: moi workflow chi dung service cua no, chay tu GOC repo:
#   docker compose up -d --no-build backend    # keo theo tp-latex
#   docker compose up -d --no-build frontend
#   docker compose up -d --no-build mcp
# `up -d <service>` khong dung toi service khac (dung --remove-orphans o day).
#
# Local dev (build tu source thay vi keo image tu GHCR):
#   docker compose up -d --build
name: talentpulse

services:
  backend:
    image: ${BACKEND_IMAGE:-tp-backend-local}
    build:
      context: ./apps/backend
    container_name: tp-backend
    ports:
      - "127.0.0.1:8001:8001"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001"]
    # Bat buoc: `docker compose up -d backend` chi dung service duoc goi ten, nen
    # thieu depends_on thi tp-latex (render CV PDF) se khong bao gio duoc khoi dong.
    depends_on:
      - tp-latex
      # Cung ly do voi tp-latex: `up -d backend` chi dung service duoc goi ten,
      # nen thieu depends_on thi redis khong bao gio duoc khoi dong tren box.
      - redis
      # DB cua app nam ngay tren web box nay. Backend chay `alembic upgrade head`
      # luc khoi dong, nen postgres PHAI len truoc — thieu depends_on thi lenh
      # alembic that bai va container crash-loop.
      - postgres
    env_file: .env
    environment:
      # Postgres lives on the warehouse box. No default: a fallback here would
      # point at a host that does not exist and fail at the first query instead
      # of at startup. Set it to the warehouse tailnet address:
      #   postgresql://<user>:<pass>@<WAREHOUSE_TAILNET_IP>:5432/warehouse
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set - point it at the warehouse box tailnet IP}"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8002}
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set - generate with python -c 'import secrets; print(secrets.token_urlsafe(48))'}"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-TalentPuseBot}
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET must be set}"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-talentpulse-raw}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://tp-mcp:8080/mcp/}
      LATEX_SERVICE_URL: ${LATEX_SERVICE_URL:-http://tp-latex:8090}
      # Cache. CO default (khac DATABASE_URL): redis la TUY CHON — app phai chay
      # duoc khi no chet, nen tro sai hoac khong co redis chi lam mat cache chu
      # khong gay tinh nang. Xem app/core/cache.py.
      REDIS_URL: ${REDIS_URL:-redis://tp-redis:6379/0}
      # Prefect la scheduler cua alert (tp-prefect-server + tp-alert-worker) —
      # loop 2h trong process phai tat mac dinh. Bat lai = 1 khi can luoi an toan.
      ALERT_LOOP_ENABLED: ${ALERT_LOOP_ENABLED:-0}
    networks:
      - talentpulse
    restart: unless-stopped

  tp-latex:
    # Image name pin cung. Neu de compose tu dat ten (<project>-tp-latex), doi
    # project name la doi ten image -> `up --no-build` khong tim thay image cu va
    # deploy gay. Service nay khong publish len GHCR, runner tu build khi thieu
    # (xem step "Ensure tp-latex image" trong .github/workflows/backend.yml).
    image: tp-latex:local
    build:
      context: ./apps/backend/deploy/tp-latex
    container_name: tp-latex
    networks:
      - talentpulse
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-tp-frontend-local}
    build:
      context: ./apps/frontend
      args:
        # Mac dinh RONG = goi API cung origin (`/api/...`) de di qua nginx.
        #
        # Truoc day mac dinh la http://localhost:8001, ma Next INLINE HOA
        # NEXT_PUBLIC_* luc BUILD, nen dia chi do bi nuong cung vao bundle: trinh
        # duyet goi thang backend, bo qua nginx hoan toan. Hau qua la moi thu
        # nginx dang lo — client_max_body_size 10m cho upload CV, tat buffer cho
        # SSE, timeout dai cho luot LLM — deu KHONG co tac dung voi nguoi dung.
        #
        # Dev cuc bo khong chay nginx thi dat lai bien nay ve http://localhost:8001.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE-}
        NEXT_PUBLIC_DOMAIN: ${NEXT_PUBLIC_DOMAIN:-http://localhost:8002}
        # Kill-switch AI: phai truyen luc BUILD (Next inline hoa NEXT_PUBLIC_*),
        # dat o `environment:` khong co tac dung. Mac dinh rong = tat.
        NEXT_PUBLIC_AI_HOME: ${NEXT_PUBLIC_AI_HOME:-}
    container_name: tp-frontend-standalone
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      PORT: "8002"
      # Next.js standalone binds to $HOSTNAME; Docker defaults it to the container id,
      # which is unresolvable (EAI_AGAIN) and crash-loops the server. Force 0.0.0.0.
      HOSTNAME: "0.0.0.0"
      API_BASE_INTERNAL: ${API_BASE_INTERNAL:-http://tp-backend:8001}
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8001}
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set - generate with python -c 'import secrets; print(secrets.token_urlsafe(48))'}"
    networks:
      - talentpulse
    restart: unless-stopped

  mcp:
    image: ${MCP_IMAGE:-tp-mcp-local}
    build:
      context: ./apps/mcp
    container_name: tp-mcp
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # MCP_DATABASE_URL chu khong phai DATABASE_URL: trong monorepo, ten
      # DATABASE_URL da thuoc ve backend (schema app). MCP tro vao warehouse.
      # Same story as the backend: `talentpulse-postgres` was a docker DNS name on
      # the shared network and resolves to nothing from the web box.
      # KHONG dung `:?` o day. Compose noi suy CA FILE luc parse, nen mot bien
      # bat buoc cua service nay lam CHET moi lenh compose tren may — ke ca
      # `docker compose up -d backend`, thu chang lien quan gi toi MCP. Da vap
      # that: deploy backend do o day du MCP khong he duoc bat.
      # Default duoi day co y VO NGHIA de MCP that bai ngay va noi ro ly do khi
      # ai do that su bat no, thay vi am tham tro nham DB.
      DATABASE_URL: "${MCP_DATABASE_URL:-postgresql://MCP_DATABASE_URL-chua-duoc-dat@127.0.0.1:1/warehouse}"
      DASHBOARD_API_URL: ${DASHBOARD_API_URL:-http://tp-backend:8001}
      DASHBOARD_API_SECRET: ${DASHBOARD_API_SECRET:-}
    networks:
      - talentpulse
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Prefect cua WEB BOX (rieng, khong lien quan warehouse box) ─────────────
  # Chi lo alert dispatch: scheduler + UI + worker, khong keo theo stack crawl.
  # Warehouse box chay prefect cua no (repo pipeline_data) — hai ben doc lap.
  #
  # ⚠️ Prefect 2 OSS khong co auth: port 4200 chi bind loopback, khong bao gio
  # publish ra ngoai. Muon xem UI tu xa thi di qua tailscale serve.
  tp-prefect-server:
    image: prefecthq/prefect:2.16.5-python3.10
    container_name: tp-prefect-server
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PREFECT_UI_API_URL: http://127.0.0.1:4200/api
      # Ten bien DUNG cua 2.16 la PREFECT_API_DATABASE_CONNECTION_URL (khong
      # phai PREFECT_SERVER_...). Ten sai bi bo qua lang le va server roi ve
      # sqlite — da vuong dung loi nay luc dung 2.20.
      PREFECT_API_DATABASE_CONNECTION_URL: "postgresql+asyncpg://talentpulse:${APP_POSTGRES_PASSWORD:-change-me-before-migration}@tp-postgres:5432/prefect"
    ports:
      - "127.0.0.1:4200:4200"
    networks:
      - talentpulse
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  tp-alert-worker:
    # Image rieng cua web box, chi chua cac flow alert (deploy/prefect).
    build:
      context: ./deploy/prefect
    image: tp-alert-worker:local
    container_name: tp-alert-worker
    command: ["python", "-m", "flows.alerts"]
    environment:
      PREFECT_DEPLOY: "1"
      PREFECT_API_URL: http://tp-prefect-server:4200/api
      DASHBOARD_API_URL: http://tp-backend:8001
      ALERT_DISPATCH_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    depends_on:
      - tp-prefect-server
    networks:
      - talentpulse
    restart: unless-stopped

  # Postgres RIENG cho du lieu van hanh cua app (schema `app`: user, ung tuyen,
  # chat, alert log). KHAC HAN kho phan tich dbt tren warehouse box.
  #
  # ⚠️ CANH BAO: tu khi service nay giu du lieu that, `docker compose down -v`
  # tren web box se XOA SACH TAI KHOAN NGUOI DUNG. Truoc day lenh do vo hai vi
  # web box khong giu trang thai gi. Xem docs/DEPLOY.md.
  #
  # Chua co ai dung service nay: backend van tro DATABASE_URL vao kho nhu cu cho
  # toi khi buoc di tru chay. Them truoc de ha tang san sang, khong doi hanh vi.
  postgres:
    image: postgres:16-alpine
    container_name: tp-postgres
    # "127.0.0.1:5432" chu KHONG phai "5432:5432". Dang sau bind 0.0.0.0 = phoi
    # DB ra Internet cho ca the gioi thu mat khau. Dang nay chi nghe tren loopback
    # cua host; box warehouse voi toi qua `tailscale serve`, khong qua IP cong cong.
    #
    # Can co de flow `sync_to_web` (repo pipeline_data) day du lieu job tu kho
    # sang day. Truoc do tp-postgres khong publish gi ca nen khong ai ngoai host
    # nay cham toi duoc — ke ca qua tailnet.
    ports:
      - "127.0.0.1:5432:5432"
    # Khong publish ra host: chi cac service trong mang talentpulse ket noi duoc.
    environment:
      POSTGRES_USER: ${APP_POSTGRES_USER:-talentpulse}
      # CO default, KHONG dung cu phap `:?` bat buoc nhu DATABASE_URL.
      #
      # Ly do: compose PARSE CA FILE ke ca khi chi `up -d backend`, nen mot bien
      # bat buoc o day se lam GAY TAT CA workflow CI hien tai (chung khong ghi
      # bien nay vao .env). Da thu va xac nhan: `docker compose config` bao loi.
      #
      # ⚠️ Mat khau mac dinh nay chi an toan chung nao DB con RONG. Truoc khi chay
      # buoc di tru dua du lieu nguoi dung that sang day, BAT BUOC dat
      # APP_POSTGRES_PASSWORD bang mot chuoi that:
      #   python -c "import secrets; print(secrets.token_urlsafe(32))"
      # Service nay khong publish cong ra host, chi cac container cung mang thay.
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-change-me-before-migration}
      POSTGRES_DB: ${APP_POSTGRES_DB:-talentpulse}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Tao database `prefect` khi volume MOI (docker-entrypoint-initdb.d chi
      # chay mot lan dau). Prefect server can DB rieng de khong dap vao schema
      # public cua app.
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - talentpulse
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_POSTGRES_USER:-talentpulse} -d ${APP_POSTGRES_DB:-talentpulse}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tp-redis
    # Khong publish cong ra host: chi cac service trong mang talentpulse dung.
    # Mo ra ngoai la mo mot kho khoa khong mat khau cho ca internet.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      # Cache thi phai duoc phep quen: day du thi bo key it dung nhat, KHONG
      # duoc tra loi loi cho backend. `noeviction` (mac dinh) se lam moi lenh
      # ghi bao loi khi day - dung sai cho use case nay.
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - talentpulse
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ── Umami: do luu luong tu host, tren DATABASE RIENG ────────────────────────
  # Chay tren cung instance Postgres nhung mot database khac (`umami`) voi role
  # rieng (`umami_app`). Khong dung chung database voi app: Umami la phan mem
  # ben thu ba co giao dien dang nhap mo ra Internet; mot lo hong o do ma dung
  # chung role voi app la doc duoc thang bang `app.users`.
  #
  # KHONG co `ports:` — Umami chi ra ngoai qua nginx (/s/*). Publish thang mot
  # cong nua la them mot man dang nhap nua phoi ra Internet ma khong ai nho.
  #
  # Cac bien nay KHONG co gia tri mac dinh nhung cung khong dung cu phap `:?`
  # bat buoc, vi compose parse ca file ngay ca khi chi `up -d backend` — dat
  # bat buoc se lam gay moi workflow CI hien tai (xem ghi chu o service postgres).
  # Doi lai, quen dat bien thi Umami khong khoi dong duoc; deploy/umami/README.md
  # ghi ro cac buoc cap phat.
  umami:
    # Image CHINH CHU build tu source voi `--build-arg BASE_PATH=/umami`. Image
    # chuan tu GHCR khong doc BASE_PATH (build-time variable): dat o sub path thi
    # Next.js hardcode `/_next/` va `/api/` — browser goi ve `/` roi vao frontend
    # 404 -> dashboard trang trang. Workflow umami.yml build+push len GHCR roi
    # set UMAMI_IMAGE khi deploy; default o day giu image local da build thu cong
    # (xem deploy/umami/README.md va .github/workflows/umami.yml).
    image: ${UMAMI_IMAGE:-umami-custom:3.2.0}
    container_name: tp-umami
    restart: unless-stopped
    # Port loopback de SSH tunnel xem dashboard tu may ngoai. Cong khai chi di
    # qua nginx `/umami/` (TLS + login) — KHONG mo 0.0.0.0.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://umami_app:${UMAMI_DB_PASSWORD}@postgres:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: "1"
    depends_on:
      - postgres
    networks:
      - talentpulse
    healthcheck:
      # Dung 127.0.0.1 chu khong phai localhost: trong container nay `localhost`
      # resolve sang IPv6 ::1, ma Next.js chi bind IPv4 -> healthcheck fail nham
      # (Status=unhealthy) du server van chay tot.
      # Image custom co basePath=/umami nen path chinh la /umami/api/heartbeat.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/umami/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: tp-nginx
    # KHONG duoc keo len boi `up -d backend/frontend/mcp` (compose chi dung
    # service duoc goi ten). Tren box phai chay rieng:
    #   docker compose up -d --no-build nginx
    # Lenh do se keo theo ca frontend + backend nho depends_on ben duoi.
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Log truy cap phai nam ngoai container. Khong co dong nay thi no chi ton
      # tai o lop ghi cua container va BIEN MAT moi lan redeploy — tuc la khong
      # con ban ghi luu luong nao ben phia may chu. Day cung la nguon do luu
      # luong duy nhat ma trinh chan quang cao khong the xoa duoc.
      #
      # `../logs/nginx` (NGAI worktree, khong phai `./logs/nginx`): nginx chay
      # root nen file log ben trong la root-owned. De trong worktree thi moi lan
      # self-hosted runner checkout (`git clean` untracked) chet voi EACCES va
      # deploy bi chan — da vap that (2026-08-07). Ngoai worktree thi runner
      # khong bao gio dong toi.
      - ../logs/nginx:/var/log/nginx
    networks:
      - talentpulse
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 chu KHONG phai localhost: trong container, `localhost` phan giai
      # ra ::1 (IPv6) truoc, ma `listen 80` cua nginx chi bind IPv4 -> healthcheck
      # bao "Connection refused" va container bi danh dau unhealthy trong khi no
      # dang phuc vu binh thuong. Da vap dung loi nay luc test.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
  # ⚠️ Chua du lieu NGUOI DUNG THAT (tai khoan, ung tuyen, chat, alert log).
  # `docker compose down -v` xoa volume nay = mat sach. Luon dump ra R2 truoc khi
  # lam bat cu thao tac nao co co -v.
  postgres-data:

networks:
  # Owned by this compose file now, not borrowed. It used to be `external: true`,
  # created by pipeline_data's compose — which only worked because both stacks
  # shared one host. On the web box that network does not exist and `up` fails
  # outright. Postgres is no longer a container on this network; it is a tailnet
  # address (see DATABASE_URL).
  # No explicit `name:` — let compose namespace it per project. Hardcoding
  # `talentpulse` would collide with the network pipeline_data's compose creates
  # under the same name when both stacks run on one machine for local dev.
  talentpulse:
    driver: bridge
