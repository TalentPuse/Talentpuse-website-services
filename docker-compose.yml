services:
  backend:
    image: ${BACKEND_IMAGE:-tp-backend-local}
    build: .
    container_name: tp-backend
    ports:
      - "127.0.0.1:8001:8001"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://metabase_ro:metabase_ro@localhost:5432/warehouse}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8002}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
    networks:
      - talentpulse
    restart: unless-stopped

networks:
  talentpulse:
    external: true
