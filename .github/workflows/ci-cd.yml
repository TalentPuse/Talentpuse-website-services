name: CI/CD Pipeline — MCP Server

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: talentpulse-mcp-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mcp_talentpulse
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: [self-hosted, Linux, X64, mcp_warehouse]
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull and deploy MCP server
        run: |
          export REGISTRY=${{ env.REGISTRY }}
          export IMAGE_NAME=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          export IMAGE_TAG=sha-${{ github.sha }}
          export IMAGE_TAG_FALLBACK=${{ github.ref_name }}

          if ! docker pull ${REGISTRY}/${IMAGE_NAME}-mcp_talentpulse:${IMAGE_TAG}; then
            echo "Fallback to ${IMAGE_TAG_FALLBACK}"
            export IMAGE_TAG=${IMAGE_TAG_FALLBACK}
            docker pull ${REGISTRY}/${IMAGE_NAME}-mcp_talentpulse:${IMAGE_TAG}
          fi

          export MCP_IMAGE=${REGISTRY}/${IMAGE_NAME}-mcp_talentpulse:${IMAGE_TAG}
          docker compose up -d --no-build
          docker image prune -f

          echo "MCP deployment successful!"
          docker compose ps
