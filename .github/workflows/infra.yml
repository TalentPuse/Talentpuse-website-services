name: Infra (nginx + redis)

# Vi sao can workflow rieng:
#
# Ba workflow kia deu loc theo `paths: apps/<ten>/**`, nen sua docker-compose.yml
# hay deploy/nginx/nginx.conf KHONG kich hoat gi ca — thay doi ha tang nam yen
# trong repo ma khong bao gio toi duoc box.
#
# Ngoai ra `docker compose up -d <service>` chi dung dung service duoc goi ten,
# nen nginx khong bao gio duoc khoi dong boi workflow backend/frontend/mcp.
# Redis thi co (no nam trong depends_on cua backend), nhung van goi ten o day cho
# ro rang thay vi phu thuoc vao tac dung phu.

on:
  push:
    branches: [develop]
    paths:
      - "docker-compose.yml"
      - "deploy/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

concurrency:
  group: talentpulse-infra-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy nginx + redis
    runs-on: [self-hosted, Linux, X64, talentpulse_backend]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')

    steps:
      # Xem ghi chu day du o backend.yml deploy job (step nay can thiet mot lan).
      - name: Clean stale logs
        run: |
          # Xem ghi chu o backend.yml: runner khong co sudo, dung docker container
          # chay root — mount CA worktree roi rm -rf /ws/logs (xoa ca thu muc
          # root-owned lan noi dung).
          if [ -e "$GITHUB_WORKSPACE/logs" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE":/ws alpine rm -rf /ws/logs || {
              echo "Khong xoa duoc logs. Chay tay tren box:"
              echo "  sudo rm -rf $GITHUB_WORKSPACE/logs"
              exit 1
            }
          fi
          echo "logs trong worktree da sach"

      - name: Checkout code
        uses: actions/checkout@v5
        # `clean: false`: runner khong xoa duoc logs/nginx (root-owned qua bind
        # mount) — xem ghi chu day du o backend.yml deploy job.
        with:
          clean: false

      # Bat buoc du nginx/redis khong dung bien nao trong so nay: compose doc CA
      # file truoc khi chay, ma backend khai bao `DATABASE_URL:?` / `JWT_SECRET:?`
      # (cu phap bat-buoc-phai-co). Thieu .env thi `docker compose` bao loi ngay
      # ca khi ta chi dinh dung nginx.
      - name: Create runtime .env
        run: |
          # KHONG duoc viet subset nhu truoc: compose doc .env truoc khi chay,
          # va neu ghi thieu bien thi service khac (vi du umami) khi duoc
          # `up -d` lai se nhan DATABASE_URL thieu password roi crash. Giu NGUYEN
          # bo bien nhu backend.yml — viet thieu bien khong bao gio dung dung y,
          # chi lam container dang chay tot chet vao lan recreate tiep theo.
          rm -f .env
          cat > .env <<'EOF'
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME=${{ secrets.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL=${{ secrets.OPENAI_MODEL }}
          S3_ENDPOINT_URL=${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
          MCP_DATABASE_URL=${{ secrets.MCP_DATABASE_URL }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          JD_LLM_API_KEY=${{ secrets.JD_LLM_API_KEY }}
          JD_LLM_BASE_URL=${{ secrets.JD_LLM_BASE_URL }}
          JD_LLM_MODEL=${{ secrets.JD_LLM_MODEL }}
          # Xem ghi chu trong backend.yml: thieu bien nay thi tp-postgres tao lai
          # tren volume moi se quay ve mat khau mac dinh yeu ma khong ai biet.
          APP_POSTGRES_PASSWORD=${{ secrets.APP_POSTGRES_PASSWORD }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          UMAMI_DB_PASSWORD=${{ secrets.UMAMI_DB_PASSWORD }}
          UMAMI_APP_SECRET=${{ secrets.UMAMI_APP_SECRET }}
          UMAMI_WEBSITE_ID=${{ secrets.UMAMI_WEBSITE_ID }}
          EOF
          sed -i 's/^[[:space:]]*//' .env
          test -f .env || { echo "Failed to create .env"; exit 1; }

      - name: Validate compose file
        run: docker compose config --quiet

      # Kiem cu phap TRUOC khi thay container dang chay. Config nginx sai ma cu
      # `up` thi container moi crash-loop va site chet — kiem trong mot container
      # dung mot lan thi sai cu phap chi lam do CI, khong cham vao cai dang phuc vu.
      - name: Validate nginx config
        run: |
          docker run --rm -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      # Caddy cua nha cung cap VPS chiem san 0.0.0.0:80 va enabled trong systemd,
      # nen nginx khong bind duoc: "failed to bind host port 0.0.0.0:80/tcp:
      # address already in use" -> container ket o Created, ExitCode=128.
      #
      # Caddy do dang chay Caddyfile MAC DINH (chi file_server tro /usr/share/caddy,
      # khong reverse_proxy, khong domain, khong TLS) nen tat di khong mat gi.
      # Giu nginx vi config cua repo co nhung thu Caddy mac dinh khong co:
      # `proxy_buffering off` cho SSE (chat AI), block /api/copilotkit dat truoc
      # /api/, va resolver dong de song sot qua moi lan redeploy backend.
      #
      # Chi tat DUNG caddy. Neu port 80 bi thu KHAC chiem thi bao loi va dung lai
      # — tu dong kill mot tien trinh khong ro cua ai la cach pha server.
      # Muon lui: `sudo systemctl enable --now caddy`.
      - name: Free port 80 (disable Caddy)
        run: |
          set -u
          # Do cong KHONG dung sudo. `ss -tln` liet ke duoc socket dang LISTEN voi
          # user thuong; chi phan lay TEN TIEN TRINH (-p) va tat service moi can quyen.
          #
          # Ban dau step nay chay `sudo ss ...` roi suy ra "cong trong" khi lenh
          # khong in ra LISTEN. Runner khong co sudo khong-mat-khau -> lenh loi,
          # output rong -> step bao "port 80 dang trong" va di tiep, de nginx chet
          # o buoc sau voi "address already in use". Coi LENH THAT BAI la CONG TRONG
          # la bug: phai tach ro "do duoc va trong" voi "khong do duoc".
          if ! command -v ss >/dev/null 2>&1; then
            echo "Khong tim thay lenh 'ss' — khong the kiem tra port 80."
            exit 1
          fi

          if ! ss -tln 'sport = :80' | grep -q LISTEN; then
            echo "Port 80 dang trong — khong can lam gi."
            exit 0
          fi

          echo "Port 80 DANG BI CHIEM:"
          ss -tln 'sport = :80'

          # NGINX CUA CHINH TA giu cong la BINH THUONG, khong phai chuong ngai:
          # khi compose recreate, container cu nha cong roi container moi bind lai.
          # Thieu nhanh nay thi step chan dung cai trang thai KHOE MANH ma no sinh
          # ra de tao — da vap that sau khi Caddy bi dep va nginx len xanh.
          if docker ps --filter 'name=^tp-nginx$' --filter 'status=running' -q | grep -q .; then
            echo "Cong dang do tp-nginx (cua ta) giu — binh thuong, compose se recreate."
            exit 0
          fi

          # Tu day tro di la tien trinh LA giu cong, va can sudo de xem/tat. Thieu
          # sudo thi DUNG HAN va noi ro cach xu ly, thay vi im lang di tiep.
          if ! sudo -n true 2>/dev/null; then
            echo ""
            echo "Runner khong co sudo khong-mat-khau nen khong tu giai phong duoc."
            echo "Chay MOT LAN tren box (quyen root):"
            echo "    sudo systemctl disable --now caddy"
            echo "Sau do chay lai workflow nay — step se thay port 80 trong va di qua."
            exit 1
          fi

          if ! sudo -n systemctl is-active --quiet caddy; then
            echo ""
            echo "Port 80 bi chiem boi thu KHONG PHAI caddy — dung lai, can nguoi xem:"
            sudo -n ss -tlnp 'sport = :80' || true
            exit 1
          fi

          echo "Caddy dang giu port 80 — tat va disable."
          sudo -n systemctl disable --now caddy
          for i in 1 2 3 4 5; do
            ss -tln 'sport = :80' | grep -q LISTEN || { echo "Port 80 da duoc giai phong."; exit 0; }
            sleep 2
          done
          echo "Da tat caddy nhung port 80 VAN bi giu:"
          sudo -n ss -tlnp 'sport = :80' || true
          exit 1

      - name: Deploy nginx + redis
        run: |
          # `--no-deps` la CO Y: nginx khai bao depends_on frontend+backend, nen
          # thieu co nay thi moi lan sua nginx.conf se keo theo viec tao lai ca hai
          # service kia — downtime khong can thiet, va co the gay neu tag image cua
          # chung khong con trong local cache.
          #
          # `--force-recreate` la BAT BUOC: nginx bind-mount file nginx.conf (khong
          # phai image/env doi). Khong co co nay thi `docker compose up -d` thay
          # container "da dung y" roi KHONG tao lai — nginx van chay config CU
          # da load luc start, moi sua file tren dia van vo dung. Da vap that: sua
          # tracker umami xong, container bao "Up N minutes" va van phuc vu duong
          # dan cu.
          docker compose up -d --no-build --no-deps --force-recreate redis nginx
          docker image prune -f
          docker compose ps redis nginx

      # Nginx "Up" khong co nghia la no dinh tuyen dung. Goi that vao endpoint
      # health de biet no thuc su phuc vu duoc.
      - name: Smoke check
        run: |
          for i in $(seq 1 10); do
            # 127.0.0.1 chu KHONG phai localhost. Tren host, `localhost` phan giai
            # ::1 truoc, ma docker publish "80:80" chi nghe IPv4 (0.0.0.0) -> curl
            # bi tu choi ket noi du nginx chay binh thuong.
            # Da vap that: khi Caddy con giu cong thi smoke check ra 404 (Caddy bind
            # dual-stack nen ::1 van tra loi); dep Caddy xong, nginx len, smoke check
            # lai thanh "Failed to connect" — chinh la luc IPv6 lo ra.
            if curl -fsS http://127.0.0.1/nginx-health >/dev/null; then
              echo "nginx serving OK"
              exit 0
            fi
            echo "waiting for nginx ($i/10)..."
            sleep 3
          done
          echo "nginx did not become healthy"
          docker compose logs --tail 50 nginx
          exit 1
