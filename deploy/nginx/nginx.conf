# Reverse proxy cho web box: một cửa vào duy nhất (:80), phía sau là
# frontend (Next.js) và backend (FastAPI).
#
# Định tuyến:
#   /api/  -> tp-backend:8001
#   /      -> tp-frontend-standalone:8002
#
# TLS: file này CỐ Ý chỉ nghe :80. Hiện TLS đang kết thúc ở Cloudflare
# (xem docs/DEPLOY.md). Khi nào muốn nginx tự giữ chứng chỉ thì thêm block
# `listen 443 ssl` và mount cert vào — phần proxy bên dưới giữ nguyên.

# ── Log truy cap dang JSON ───────────────────────────────────────────────────
# File nay duoc mount vao /etc/nginx/conf.d/default.conf, tuc la nginx include
# no BEN TRONG block `http { }`. Vi vay `log_format` dat o day (ngoai `server`)
# la dung ngu canh — dat ben trong `server { }` se lam nginx tu choi khoi dong.
#
# escape=json BAT BUOC: user_agent va referer do client gui len, chua dau nhay
# doi va backslash tuy y. Thieu no thi mot request duy nhat co the lam hong ca
# dong log, va cong cu doc log se bo qua im lang.
#
# status/bytes/request_time KHONG boc trong dau nhay de chung ra so that su,
# khoi phai ep kieu luc phan tich.
#
# $http_cf_connecting_ip hien con rong (chua co Cloudflare dung truoc). De san
# tu bay gio de sau nay khong phai doi dinh dang log — doi dinh dang giua chung
# lam gay moi truy van chay tren du lieu cu.
log_format json_combined escape=json
  '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"cf_connecting_ip":"$http_cf_connecting_ip",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"request_time":$request_time,'
    '"upstream_status":"$upstream_status"'
  '}';

server {
    listen 80;
    server_name _;

    # ── Vì sao KHÔNG dùng block `upstream { server tp-backend:8001; }` ──────
    # Với upstream tĩnh, nginx phân giải DNS đúng MỘT lần lúc khởi động rồi giữ
    # nguyên IP. Mà mỗi lần deploy backend, container tp-backend bị tạo lại và
    # nhận IP mới trong mạng compose — nginx vẫn trỏ vào IP đã chết và trả 502
    # cho tới khi có người restart nó bằng tay.
    #
    # 127.0.0.11 là DNS nội bộ của Docker. Kết hợp với biến trong proxy_pass,
    # nginx phân giải lại theo từng request (nhớ đệm 10s), nên deploy backend
    # xong là nó tự bắt đúng container mới.
    #
    # Thêm một lợi ích: nginx khởi động được cả khi backend/frontend chưa lên —
    # upstream tĩnh sẽ làm nginx chết ngay lúc start nếu tên chưa phân giải được.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_backend  "http://tp-backend:8001";
    set $upstream_frontend "http://tp-frontend-standalone:8002";
    # Cung ly do nhu hai dong tren, va o day con quan trong hon: Umami la thanh
    # phan TUY CHON. Neu viet thang `proxy_pass http://umami:3000` thi nginx
    # phan giai ten luc khoi dong va CHET NGAY khi container umami chua ton tai
    # — tuc la mot cong cu do luu luong keo sap ca website.
    set $upstream_umami    "http://tp-umami:3000";

    # CV upload tối đa 5MB (giao diện đăng ký ghi đúng con số này).
    # Mặc định của nginx là 1m — để nguyên thì nginx trả 413 TRƯỚC khi request
    # tới được backend, người dùng thấy lỗi mà log backend sạch trơn.
    client_max_body_size 10m;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── /api/copilotkit thuộc FRONTEND, không phải backend ───────────────────
    # Đây là route Next.js (`app/api/copilotkit/route.ts`) — nơi CopilotKit dựng
    # runtime AG-UI và đăng ký agent `talentpuse_assistant`. Nó nằm dưới tiền tố
    # `/api/` nhưng KHÔNG do FastAPI phục vụ.
    #
    # Thiếu block này, `location /api/` nuốt luôn nó và đẩy sang backend, backend
    # trả 404 → toàn bộ chat AI chết. Trước đây lỗi không lộ vì trình duyệt gọi
    # thẳng cổng 8002 của frontend, bỏ qua nginx.
    #
    # Nginx chọn prefix DÀI NHẤT nên block này thắng `/api/`. Route này cũng
    # stream SSE, nên phải lặp lại nguyên bộ cấu hình chống buffer bên dưới.
    location /api/copilotkit {
        proxy_pass $upstream_frontend$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 30s;
    }

    location /api/ {
        # $request_uri giu nguyen ca duong dan lan query string.
        proxy_pass $upstream_backend$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── BẮT BUỘC cho SSE ─────────────────────────────────────────────
        # Chat AI và agent stream bằng Server-Sent Events qua /api/agent/.
        # Nginx mặc định BUFFER phản hồi upstream: nó gom cả stream rồi mới
        # trả một cục — ô chat đứng im hàng chục giây rồi mọi thứ hiện cùng
        # lúc, hoặc treo hẳn. Ba dòng dưới tắt buffer và bỏ header Connection
        # mặc định (SSE cần kết nối giữ mở).
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # Agent gọi LLM có thể chạy lâu (client OpenAI đặt timeout 120s cho
        # parse CV). Timeout mặc định 60s của nginx sẽ cắt ngang giữa chừng.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 30s;
    }

    # Link click-tracking cua alert: /r/{uuid} la route cua BACKEND, khong
    # phai trang frontend. Thieu block nay thi `location /` day sang frontend
    # va Next.js tra 404 — nguoi dung bam link alert khong toi duoc job.
    location /r/ {
        proxy_pass $upstream_backend$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 30s;
    }

    # ── Dashboard Umami qua path cong khai ──────────────────────────────────
    # Tracking `/s/*` o block rieng; day la UI dashboard, co login bao ve.
    # Khong mo port thang 3000 ra ngoai — chi loopback 127.0.0.1:3000 cho
    # SSH tunnel. `location /umami` (KHONG trailing slash) se tao double slash
    # `//_next/x` khi proxy_pass trailing slash -> Next.js redirect ve `/_next/x`
    # -> roi vao frontend 404. Dung `location /umami/` de phan match gom ca slash
    # => URI sach den umami. Exact `location = /umami` (khong slash) cho trang
    # goc — Next.js tu redirect trailing slash sang `/umami/`.
    location = /umami {
        return 301 /umami/;
    }

    location /umami/ {
        proxy_pass http://tp-umami:3000/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bat buoc: sub_filter khong chay tren response da gzip tu upstream
        # (umami). Dam bao nhan file text/html chua nen de rewrite asset path.
        proxy_set_header Accept-Encoding "";

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 30s;

        # Umami build khong co basePath (khong doc env BASE_PATH), nen HTML tra
        # ve duong dan asset tuyet doi `/_next/...`. Browser request cac asset do
        # ve `/` roi vao frontend -> 404 -> dashboard trang trang. Rewrite chung
        # thanh `/umami/_next/...` (location nay da strip prefix den umami).
        sub_filter_once off;
        sub_filter "/_next/" "/umami/_next/";
    }

    # ── Tracker Umami phuc vu FIRST-PARTY qua /s/* ──────────────────────────
    # Vi sao duong dan la `/s/` chu khong phai `/umami/` hay `/analytics/`:
    # danh sach loc cua trinh chan quang cao khop theo CHUOI CON trong duong
    # dan, khong chi theo ten mien. Bat cu duong nao chua `umami`, `analytics`
    # hay `track` deu bi chan boi luat mac dinh. Phuc vu tu chinh origin cua
    # site qua mot duong trung tinh la khac biet giua so lieu dung duoc va so
    # lieu hut 30-40%.
    #
    # `location =` la khop CHINH XAC, thang moi prefix ke ca `location /`, nen
    # thu tu khong anh huong — nhung van dat tren `location /` cho de doc.
    location = /s/script.js {
        proxy_pass $upstream_umami/script.js;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @analytics_down;
    }

    location = /s/api/send {
        proxy_pass $upstream_umami/api/send;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @analytics_down;
    }

    # Umami chet thi tra 204 rong, KHONG phai 502. Do luu luong hong la viec
    # cua chung ta; no khong duoc phep hien ra thanh loi tren trang cua nguoi
    # dung, cung khong duoc lam console cua trinh duyet do loet.
    location @analytics_down {
        return 204;
    }

    location / {
        proxy_pass $upstream_frontend$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout    300s;
        proxy_connect_timeout 30s;
    }

    # Cho ingress/uptime check ping mà không đụng tới app.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
