name: CI/CD — MCP Server

on:
  push:
    branches: [develop]
    paths:
      - "apps/mcp/**"
      - ".github/workflows/mcp.yml"
  pull_request:
    branches: [develop]
    paths:
      - "apps/mcp/**"
      - ".github/workflows/mcp.yml"
  workflow_dispatch:

concurrency:
  group: talentpulse-mcp-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        # PHAI la apps/mcp, dung doi thanh thu muc goc repo: cac test import
        # bang `from tests...`, chay sai cho la `ModuleNotFoundError: No module
        # named 'tests'` va CI do vi ly do khong lien quan gi toi chat luong code.
        working-directory: apps/mcp
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # KHONG dat PYTHONPATH=apps/mcp: apps/mcp da bo __init__.py (2026-08-07)
        # de het dung ten voi SDK `mcp`, nhung dua apps/mcp vao sys.path van co
        # the lam mo ho. Conftest (tests/conftest.py) tu alias mcp_server sang
        # thu muc goc — khong can PYTHONPATH.
        run: pytest tests/ -v --tb=short

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mcp_talentpulse
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: apps/mcp
          file: apps/mcp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    # Cung ly do nhu frontend.yml: chi co MOT runner, mang label
    # `talentpulse_backend`. Label `mcp_warehouse` khong ung voi runner nao nen
    # job treo vo han thay vi bao loi.
    #
    # Service mcp vi the chay tren WEB BOX va noi toi kho qua tailnet
    # (MCP_DATABASE_URL tro IP tailnet cua box warehouse) — nhat quan voi cach
    # bien do duoc khai bao. Neu sau nay box warehouse co runner rieng thi doi
    # lai label o day.
    runs-on: [self-hosted, Linux, X64, talentpulse_backend]
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    timeout-minutes: 10

    steps:
      # Xem ghi chu day du o backend.yml deploy job (step nay can thiet mot lan).
      - name: Clean stale logs
        run: |
          # Xem ghi chu o backend.yml: runner khong co sudo, dung docker container
          # chay root — mount CA worktree roi rm -rf /ws/logs (xoa ca thu muc
          # root-owned lan noi dung).
          if [ -e "$GITHUB_WORKSPACE/logs" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE":/ws alpine rm -rf /ws/logs || {
              echo "Khong xoa duoc logs. Chay tay tren box:"
              echo "  sudo rm -rf $GITHUB_WORKSPACE/logs"
              exit 1
            }
          fi
          echo "logs trong worktree da sach"

      - name: Checkout code
        uses: actions/checkout@v5
        # `clean: false`: runner khong xoa duoc logs/nginx (root-owned qua bind
        # mount) — xem ghi chu day du o backend.yml deploy job.
        with:
          clean: false

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull and deploy MCP server
        run: |
          export REGISTRY=${{ env.REGISTRY }}
          export IMAGE_NAME=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          export IMAGE_TAG=sha-${{ github.sha }}
          export IMAGE_TAG_FALLBACK=${{ github.ref_name }}

          if ! docker pull ${REGISTRY}/${IMAGE_NAME}-mcp_talentpulse:${IMAGE_TAG}; then
            echo "Fallback to ${IMAGE_TAG_FALLBACK}"
            export IMAGE_TAG=${IMAGE_TAG_FALLBACK}
            docker pull ${REGISTRY}/${IMAGE_NAME}-mcp_talentpulse:${IMAGE_TAG}
          fi

          export MCP_IMAGE=${REGISTRY}/${IMAGE_NAME}-mcp_talentpulse:${IMAGE_TAG}

          # MCP_DATABASE_URL chu khong phai DATABASE_URL: trong monorepo, ten
          # DATABASE_URL da thuoc ve backend (schema app). MCP tro vao warehouse
          # nen dung secret rieng.
          export MCP_DATABASE_URL=${{ secrets.MCP_DATABASE_URL }}
          export DASHBOARD_API_URL=${{ secrets.DASHBOARD_API_URL }}
          export DASHBOARD_API_SECRET=${{ secrets.DASHBOARD_API_SECRET }}

          # Remove old container if exists (handles manual runs, name conflicts)
          docker rm -f tp-mcp 2>/dev/null || true

          docker compose up -d --no-build --force-recreate mcp
          docker image prune -f

          # Ensure container is on talentpulse network
          docker network connect talentpulse tp-mcp 2>/dev/null || true

          echo "MCP deployment successful!"
          docker compose ps mcp
          docker logs tp-mcp --tail 5
